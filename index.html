<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LabLink – Making College Laboratories More Accessible. AI-powered university laboratory equipment discovery, booking, compatibility analysis, and resource sharing ecosystem.">
  <meta name="theme-color" content="#4F46E5">
  <title>LabLink – Making College Laboratories More Accessible</title>

  <!-- Typography: Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Design Tokens & Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Initial Splash Loader Styles -->
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      background: #4F46E5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }
    .loader-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .loader-logo h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .loader-tagline {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }
    .spinner-ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Initial Splash Loading Screen -->
  <div id="initial-loader">
    <div class="loader-logo">
      <svg width="46" height="46" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="rgba(255,255,255,0.2)"/>
        <path d="M15 8h10M17 8v10l-6 12a2 2 0 001.8 2.8h14.4A2 2 0 0029 30.8L23 18V8"
              stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="17" cy="27" r="1.5" fill="#C7D2FE"/>
        <circle cx="22" cy="30" r="1" fill="#E0E7FF"/>
        <circle cx="25" cy="26" r="1.2" fill="#A5B4FC"/>
      </svg>
      <h1>LabLink</h1>
    </div>
    <div class="loader-tagline">Making College Laboratories More Accessible</div>
    <div class="spinner-ring"></div>
  </div>

  <!-- Single-Page Application Mount -->
  <div id="app"></div>

  <!-- Floating Toast Notifications Mount -->
  <div id="toast-container" style="position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none;"></div>

  <!-- Modal Portal Mount -->
  <div id="modal-container"></div>

  <!-- Application Script Loading Pipeline -->
  <script src="data.js"></script>
  <script src="projectsData.js"></script>
  <script src="layout.js"></script>
  <script src="pages/login.js"></script>
  <script src="pages/discover.js"></script>
  <script src="pages/autopilot.js"></script>
  <script src="pages/builder.js"></script>
  <script src="pages/watchbuild.js"></script>
  <script src="pages/portfolio.js"></script>
  <script src="pages/student.js"></script>
  <script src="pages/faculty.js"></script>
  <script src="pages/admin.js"></script>
  <script src="app.js"></script>

</body>
</html>
